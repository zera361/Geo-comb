name: Build geo rules

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "builder.py"
      - "export_mihomo.py"
      - "build.sh"
      - "router.proto"
      - ".github/workflows/build.yml"

permissions:
  contents: write

concurrency:
  group: build-geo-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Сборка geosite/geoip.dat + конвертация в .mrs
        run: |
          chmod +x build.sh
          ./build.sh config/config.json

      - name: Публикация артефактов в ветку release
        run: |
          set -euo pipefail
          cd output

          git init -q
          git checkout -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Auto-build $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin release

      - name: Лог дублей/ошибок (если есть)
        if: always()
        run: |
          if [ -f tools/review.log ] && [ -s tools/review.log ]; then
            echo "::warning::Есть записи в review.log, см. artifact ниже"
          fi

      - name: Загрузить review.log как artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-log
          path: tools/review.log
          if-no-files-found: ignore
